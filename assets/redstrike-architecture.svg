<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-label="RedStrike Agentic Active Directory Assessment Architecture Flow">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120306"/>
      <stop offset="40%" stop-color="#080204"/>
      <stop offset="100%" stop-color="#030102"/>
    </linearGradient>

    <!-- Top Ambient Red Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBrain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f070c"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>

    <linearGradient id="cardMcp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24080e"/>
      <stop offset="100%" stop-color="#150408"/>
    </linearGradient>

    <linearGradient id="cardHitl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261705"/>
      <stop offset="100%" stop-color="#170c02"/>
    </linearGradient>

    <linearGradient id="cardExec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b080f"/>
      <stop offset="100%" stop-color="#190408"/>
    </linearGradient>

    <linearGradient id="cardEvidence" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#081e28"/>
      <stop offset="100%" stop-color="#041117"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="crimsonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="50%" stop-color="#e11d2a"/>
      <stop offset="100%" stop-color="#a30d18"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff4d4d" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrDownRed" markerWidth="10" markerHeight="10" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#ff4d4d"/>
    </marker>
    <marker id="arrDownGold" markerWidth="10" markerHeight="10" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#f59e0b"/>
    </marker>
    <marker id="arrDownGreen" markerWidth="10" markerHeight="10" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#34d399"/>
    </marker>
    <marker id="arrDownCyan" markerWidth="10" markerHeight="10" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="1120" fill="url(#bgGrad)"/>
  <rect width="960" height="400" fill="url(#topGlow)"/>

  <!-- ========================================================================= -->
  <!-- HEADER &amp; LOGO                                                             -->
  <!-- ========================================================================= -->
  <g transform="translate(480, 50)">
    <!-- RedStrike Shield &amp; Lightning Bolt -->
    <g transform="translate(-280, -26) scale(0.38)">
      <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z" fill="url(#crimsonGrad)" stroke="#7a0a12" stroke-width="3"/>
      <path d="M60 26 L38 74 L54 74 L46 116 L80 54 L58 54 Z" fill="#ffffff" opacity="0.95"/>
    </g>
    <text x="24" y="8" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">
      <tspan fill="url(#crimsonGrad)">REDSTRIKE</tspan>
      <tspan fill="#ffffff" font-weight="800"> | AGENTIC FLOW</tspan>
    </text>
    <text x="0" y="38" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#fca5a5">
      Policy-Gated Active Directory Assessment &amp; Campaign Execution Pipeline
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 1: THE BRAIN (LLM Agent) (y=115, h=145)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(90, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="780" height="145" rx="14" fill="url(#cardBrain)" stroke="#991b1b" stroke-width="2"/>
    
    <!-- Stage Header Badge -->
    <circle cx="28" cy="28" r="16" fill="#e11d2a"/>
    <text x="28" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">1</text>
    
    <text x="56" y="34" font-family="sans-serif" font-size="19" font-weight="900" fill="#ffffff">THE BRAIN (LLM Agent &amp; Cognitive Decision Engine)</text>
    <rect x="635" y="14" width="130" height="28" rx="6" fill="#360a10" stroke="#e11d2a" stroke-width="1.2"/>
    <text x="700" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ff4d4d">AUTONOMOUS</text>

    <!-- Sub-bullets -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>Agent Clients:</strong> Claude Desktop · Cursor · Cline · OpenHands · Custom Agent Swarms</text>
      <text x="0" y="42" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>Strategy Reasoning:</strong> Evaluates Active Directory attack graph, delegation paths &amp; kill-chain</text>
      <text x="0" y="68" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#34d399">• Calls Structured Intent Tools: `find_delegation` · `enumerate_domain_users` · `certipy_find`</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(480, 260)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#ff4d4d" stroke-width="3.5" marker-end="url(#arrDownRed)"/>
    <rect x="-140" y="8" width="280" height="22" rx="4" fill="#200609" stroke="#7f1d1d" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ff8080">JSON-RPC (Model Context Protocol)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 2: REDSTRIKE MCP SERVER &amp; FASTAPI (y=300, h=135)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(90, 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="780" height="135" rx="14" fill="url(#cardMcp)" stroke="#e11d2a" stroke-width="2" filter="url(#glowRed)"/>
    
    <!-- Stage Header Badge -->
    <circle cx="28" cy="28" r="16" fill="#e11d2a"/>
    <text x="28" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">2</text>
    
    <text x="56" y="34" font-family="sans-serif" font-size="19" font-weight="900" fill="#ffffff">REDSTRIKE MCP SERVER &amp; FASTAPI INGRESS</text>
    <rect x="635" y="14" width="130" height="28" rx="6" fill="#360a10" stroke="#e11d2a" stroke-width="1.2"/>
    <text x="700" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ff4d4d">CONTROL PLANE</text>

    <!-- Sub-bullets -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>Local Authentication:</strong> Validates internal operator `REDSTRIKE_API_KEY` (Loopback trust)</text>
      <text x="0" y="42" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>No Raw Shell Allowed:</strong> Ingests typed intent parameters; rejects arbitrary command strings</text>
      <text x="0" y="66" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">• Dispatches structured requests to `ScopePolicy` and async `/jobs` queue</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(480, 435)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrDownGold)"/>
    <rect x="-130" y="8" width="260" height="22" rx="4" fill="#241403" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#fde047">Policy &amp; Gate Evaluation</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 3: POLICY &amp; HITL OPERATOR GATE (y=475, h=180)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(90, 475)" filter="url(#shadow)">
    <rect x="0" y="0" width="780" height="180" rx="14" fill="url(#cardHitl)" stroke="#f59e0b" stroke-width="2.2" filter="url(#glowGold)"/>
    
    <!-- Stage Header Badge -->
    <circle cx="28" cy="28" r="16" fill="url(#goldGrad)"/>
    <text x="28" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#0c0701">3</text>
    
    <text x="56" y="34" font-family="sans-serif" font-size="19" font-weight="900" fill="#ffffff">POLICY &amp; HITL OPERATOR GATEKEEPER</text>
    <rect x="635" y="14" width="130" height="28" rx="6" fill="#382006" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="700" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#fde047">SAFETY GATES</text>

    <!-- Sub-bullets -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fef08a">• <strong>[1] Scope Validation:</strong> Verifies target IP/domain against `scope.yaml` — <strong>Auto-rejects out-of-scope</strong></text>
      <text x="0" y="42" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fef08a">• <strong>[2] Mode Enforcement:</strong> Enforces `observe` (read-only audit) vs `exploit` permissions</text>
      <text x="0" y="68" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#fde047">• <strong>[3] ✋ Human-in-the-Loop Gate:</strong> High-risk jumps PAUSE for operator: `redstrike-campaign approve`</text>
      <text x="0" y="94" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">• Concurrency limits &amp; domain cooldowns prevent DC lockouts and runaway exploitation</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <g transform="translate(480, 655)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#34d399" stroke-width="3.5" marker-end="url(#arrDownGreen)"/>
    <rect x="-140" y="8" width="280" height="22" rx="4" fill="#09281a" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#34d399">✓ Gate Approved: Safe Execution</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 4: TYPED EXECUTION LAYER (y=695, h=165)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(90, 695)" filter="url(#shadow)">
    <rect x="0" y="0" width="780" height="165" rx="14" fill="url(#cardExec)" stroke="#ff4d4d" stroke-width="2.2" filter="url(#glowRed)"/>
    
    <!-- Stage Header Badge -->
    <circle cx="28" cy="28" r="16" fill="#e11d2a"/>
    <text x="28" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">4</text>
    
    <text x="56" y="34" font-family="sans-serif" font-size="19" font-weight="900" fill="#ffffff">TYPED EXECUTION LAYER (`shell=False` ARGV)</text>
    <rect x="635" y="14" width="130" height="28" rx="6" fill="#360a10" stroke="#ff4d4d" stroke-width="1.2"/>
    <text x="700" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ff8080">SUBPROCESS</text>

    <!-- Sub-bullets -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>Typed Builders:</strong> `NetExec` · `Certipy` (ESC1–13) · `Rubeus` (PKINIT/S4U) · `BloodyAD` · `SharpSCCM`</text>
      <text x="0" y="42" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#fecaca">• <strong>CommandRunner:</strong> Pure list-form `argv` subprocess — <strong>Zero shell injection / No `shell=True`</strong></text>
      <text x="0" y="68" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#34d399">• <strong>Real-time Redaction:</strong> Automatically masks NT hashes &amp; passwords in logs and streams</text>
      <text x="0" y="92" font-family="sans-serif" font-size="14" font-weight="600" fill="#fca5a5">• Multi-Hop Transport: Direct Kali Linux execution or Windows WS01 remote proxy</text>
    </g>
  </g>

  <!-- Connector 4 -> 5 -->
  <g transform="translate(480, 860)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrDownCyan)"/>
    <rect x="-140" y="8" width="280" height="22" rx="4" fill="#082230" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8">Stdout / Entity Normalization</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 5: STRUCTURED EVIDENCE &amp; LEDGER (y=900, h=165)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(90, 900)" filter="url(#shadow)">
    <rect x="0" y="0" width="780" height="165" rx="14" fill="url(#cardEvidence)" stroke="#38bdf8" stroke-width="2.2"/>
    
    <!-- Stage Header Badge -->
    <circle cx="28" cy="28" r="16" fill="url(#cyanGrad)"/>
    <text x="28" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#041c26">5</text>
    
    <text x="56" y="34" font-family="sans-serif" font-size="19" font-weight="900" fill="#ffffff">STRUCTURED EVIDENCE &amp; CREDENTIAL LEDGER SSoT</text>
    <rect x="635" y="14" width="130" height="28" rx="6" fill="#0a2a3a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="700" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">DELIVERABLES</text>

    <!-- Sub-bullets -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#bae6fd">• <strong>Evidence Normalization:</strong> Output transformed into Pydantic `EvidenceRecord` models</text>
      <text x="0" y="42" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#bae6fd">• <strong>Credential Ledger (SSoT):</strong> Tracks discovered NT hashes, Kerberos TGTs &amp; DA privileges</text>
      <text x="0" y="68" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#34d399">• <strong>Audit Provenance:</strong> Cryptographic `audit_id` linkage on every observation (Zero fabrication)</text>
      <text x="0" y="92" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">• Returns structured JSON telemetry to the LLM Brain for next-step campaign decisions</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT RETURN CONDUIT (Credential Recycling Loop: Step 5 -> Step 1)         -->
  <!-- ========================================================================= -->
  <path d="M 90 985 L 35 985 L 35 185 L 85 185" fill="none" stroke="#e11d2a" stroke-width="3.5" stroke-dasharray="10 5"/>
  <polygon points="85,185 70,175 70,195" fill="#ff4d4d"/>

  <!-- Vertical Feedback Tag -->
  <g transform="translate(25, 580) rotate(-90)">
    <rect x="-160" y="-12" width="320" height="24" rx="4" fill="#1c070a" stroke="#e11d2a" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5" letter-spacing="0.5">
      ↻ DISCOVERED CREDENTIALS RECYCLED
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER                                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(480, 1095)">
    <text text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#ff4d4d">
      Python ≥ 3.10 · Policy-Aware Active Directory Engine · Typed Command Builders · Operator-Gated HITL
    </text>
  </g>
</svg>
