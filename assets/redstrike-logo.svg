<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="RedStrike logo">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="55%" stop-color="#e11d2a"/>
      <stop offset="100%" stop-color="#a30d18"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="100%" stop-color="#c4121f"/>
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(24,28)">
    <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z"
          fill="url(#redGrad)" stroke="#7a0a12" stroke-width="2"/>
    <!-- Lightning bolt (the "strike") -->
    <path d="M60 26 L38 74 L54 74 L46 116 L80 54 L58 54 Z"
          fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="url(#wordGrad)" letter-spacing="-1">RedStrike</text>

  <!-- Tagline under the wordmark -->
  <text x="162" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.4">Policy-aware Active Directory Assessment</text>
</svg>
