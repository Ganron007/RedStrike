version: 1
name: "Generic Entra ID / Hybrid Identity Reconnaissance"

# Phase 9 example. Every `entra.*` intent's flags are verified against upstream
# (Microsoft Learn azure-cli reference, SpecterOps AzureHound CE docs, ROADtools
# wiki, AADInternals cmdlet reference) — see redstrike/builders/entra.py.
#
# Scope: cloud nodes are validated against `allowed_tenants` /
# `allowed_cloud_domains` in the scope policy before ANY live run — add e.g.
#   allowed_tenants: ["contoso.onmicrosoft.com"]
# to scope.yaml. Without it, live runs fail closed on every cloud node.
#
# Credentials: ENTRA-AUTH needs an operator credential named `entra_operator`
# in the ledger (seed it or `redstrike campaign start --seed <file>`); the
# SSO-ticket node needs the AZUREADSSOACC$ machine-account hash in a credential
# named `azuread_ssoacc` (asset: Hybrid Identity → Seamless SSO).

nodes:
  - id: "ENTRA-01-AZUREHOUND"
    phase: 9.0
    title: "Collect Entra ID users, groups, and role edges (AzureHound v2)"
    path: "direct"
    beachheads: ["windows", "linux"]
    intent: "entra.user_role_enum"
    intent_args:
      tenant: "contoso.onmicrosoft.com"
      output: "/tmp/entra-azurehound-users.json"
    requires_cred: "entra_operator"
    produces_cred: "entra_graph_users"
    success_marker: "ENTRA_01_AZUREHOUND_OK"
    # AzureHound writes its collection to a file; wrap the command in a shell
    # step that emits the marker after a successful run if you need fail-closed
    # verification here (the file-export tools do not print markers).

  - id: "ENTRA-02-ROADRECON-AUTH"
    phase: 9.0
    title: "Authenticate ROADrecon (writes .roadtools_auth)"
    path: "direct"
    beachheads: ["linux"]
    intent: "entra.roadrecon_auth"
    intent_args:
      tenant: "contoso.onmicrosoft.com"
    requires_cred: "entra_operator"
    produces_cred: "roadtools_auth"
    success_marker: "ENTRA_02_ROADRECON_AUTH_OK"

  - id: "ENTRA-03-ROADRECON-GATHER"
    phase: 9.0
    title: "Gather Entra ID object relationships (roadrecon.db)"
    path: "direct"
    beachheads: ["linux"]
    intent: "entra.roadrecon_gather"
    intent_args:
      mfa: true
    depends_on: ["ENTRA-02-ROADRECON-AUTH"]
    when:
      verified: ["ENTRA-02-ROADRECON-AUTH"]
    success_marker: "ENTRA_03_ROADRECON_GATHER_OK"

  - id: "ENTRA-04-GRAPH-TENANT"
    phase: 9.1
    title: "Confirm the signed-in tenant via Microsoft Graph (structured verify)"
    path: "direct"
    beachheads: ["windows", "linux"]
    intent: "entra.account_show"
    intent_args:
      tenant: "contoso.onmicrosoft.com"
    # Structured verification: az emits JSON, so assert on the document
    # instead of a stdout marker. Replace the GUID with your tenant's id.
    success_json:
      path: "tenantId"
      equals: "00000000-1111-2222-3333-444444444444"

  - id: "ENTRA-05-GRAPH-USERS"
    phase: 9.1
    title: "Enumerate tenant users and mail-enabled principals (Graph)"
    path: "direct"
    beachheads: ["windows", "linux"]
    intent: "entra.graph_query"
    intent_args:
      tenant: "contoso.onmicrosoft.com"
      url: "https://graph.microsoft.com/v1.0/users"
      query: "value[].{upn:userPrincipalName,id:id,account:accountEnabled}"
    success_marker: "ENTRA_05_GRAPH_USERS_OK"

  - id: "ENTRA-06-SSO-TICKET"
    phase: 9.2
    title: "Forge a Seamless-SSO Kerberos ticket from AZUREADSSOACC$ (HITL)"
    path: "direct"
    beachheads: ["windows"]
    intent: "entra.kerberos_ticket"
    intent_args:
      tenant: "contoso.onmicrosoft.com"
      sid_string: "S-1-5-21-000000000-000000000-000000000-1101"
    requires_cred: "azuread_ssoacc"
    hitl_gate: "cloud_takeover"
    idempotent: false
    produces_cred: "seamless_sso_ticket"
    success_marker: "ENTRA_06_SSO_TICKET_OK"

  - id: "ENTRA-07-ADFS-SPRAY"
    phase: 9.3
    title: "ADFS spray (bring your own script — raw-args shim)"
    path: "direct"
    beachheads: ["linux"]
    intent: "entra.adfs_spray"
    stub: true
    # No canonical ADFS spray tool exists, so the shim takes literal argv:
    #   intent_args:
    #     args: ["--target", "https://adfs.contoso.com", "adfs"]
    #     binary: "ADFSpray.py"
    # Stage your chosen fork (xFreed0m/ADFSpray etc.) and enable this node
    # after confirming the exact flags with `python3 ADFSpray.py --help`.
