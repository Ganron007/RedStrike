[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redstrike"
version = "0.6.0"
description = "Standalone agentic AD/ADCS red-team toolset + campaign graph engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RedStrike" }]
keywords = ["active-directory", "adcs", "red-team", "pentest", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "networkx>=3.2,<4.0",
  "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/Ganron007/RedStrike"
Repository = "https://github.com/Ganron007/RedStrike"
Issues = "https://github.com/Ganron007/RedStrike/issues"

[project.optional-dependencies]
mcp = ["fastmcp>=0.2,<1.0", "requests>=2.31,<3.0"]
dev = ["pytest>=8.2,<9.0", "ruff>=0.5,<1.0", "httpx>=0.27,<1.0"]

[project.scripts]
redstrike = "redstrike.cli.main:main"
redstrike-api = "redstrike.api.server:main"
redstrike-mcp = "redstrike.mcp.server:main"
redstrike-campaign = "redstrike.cli.campaign:main"

[tool.setuptools.packages.find]
include = ["redstrike*", "cadre_strike*"]

[tool.ruff]
line-length = 100
target-version = "py310"
